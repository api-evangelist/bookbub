aid: bookbub
name: Bookbub
description: >-
  BookBub is a book-discovery and ebook-deals platform that connects a membership of
  over 10 million power readers with limited-time discounted ebooks, new releases,
  and preorders across major retailers (Kindle, Apple Books, Barnes & Noble, Kobo,
  Google Play) in the US, UK, Canada, and Australia. For readers it curates
  personalized daily deal alerts and recommendations; for authors and publishers it
  operates a partner side offering Featured Deals promotions, BookBub Ads (a
  self-serve display advertising platform), preorder and new-release alerts, author
  profiles, and free marketing tools, all managed through the Partner Dashboard.
  BookBub is backed by Bloomberg Beta. No public developer API is currently
  published; partner tooling is delivered through the web dashboard rather than a
  documented API surface.
